/* ============================================================
   Styles. Light mode uses a very pale yellow background;
   dark mode keeps the original charcoal palette.
   To change the main color, edit --accent in both places.
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #FDFBF0;
  --ink: #1E1C16;
  --muted: #5B5748;
  --subtle: #7B7560;
  --rule: #EAE4CF;
  --card: #FFFEF8;
  --accent: #1F3A5F;
  --accent-weak: color-mix(in srgb, var(--accent) 30%, transparent);
  --badge-bg: color-mix(in srgb, var(--accent) 7%, transparent);
  --ph-bg: color-mix(in srgb, var(--muted) 7%, var(--bg));
  --ph-ink: var(--accent);

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
  --font-serif: "Newsreader", "Source Serif 4", Georgia, "Songti SC", "Times New Roman", serif;

  --measure: 66ch;
  --radius: 12px;
  --radius-sm: 8px;
  --nav-h: 60px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111315;
  --ink: #ECECE8;
  --muted: #a9a9a3;
  --subtle: #8a8a84;
  --rule: #262a2e;
  --card: #171a1d;
  --accent: #9DBAE0;
  --badge-bg: color-mix(in srgb, var(--accent) 14%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111315;
    --ink: #ECECE8;
    --muted: #a9a9a3;
    --subtle: #8a8a84;
    --rule: #262a2e;
    --card: #171a1d;
    --accent: #9DBAE0;
    --badge-bg: color-mix(in srgb, var(--accent) 14%, transparent);
  }
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3 { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; }
p { margin: 0 0 1em; }
a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-weak); transition: border-color .15s ease, color .15s ease; }
a:hover { border-bottom-color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2.2em 0; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.self { border-bottom: 1.5px solid var(--ink); font-weight: 500; color: var(--ink); }
section[id] { scroll-margin-top: calc(var(--nav-h) + 8px); }

/* ---------- Layout ---------- */
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 28px; }
main { padding: 40px 0 60px; }
.section { padding: 28px 0; }
.section + .section { border-top: 1px solid var(--rule); }
.section-label {
  font-family: var(--font-sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin: 0 0 20px;
}
.section-intro { color: var(--muted); font-size: 14px; margin: -8px 0 22px; max-width: var(--measure); }

/* ---------- Nav ---------- */
.nav {
  position: sticky; top: 0; z-index: 20;
  height: var(--nav-h);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.1) blur(8px);
  -webkit-backdrop-filter: saturate(1.1) blur(8px);
  border-bottom: 1px solid var(--rule);
}
.nav .inner {
  max-width: 1040px; margin: 0 auto; padding: 0 28px; height: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.nav .brand { font-family: var(--font-serif); font-size: 17px; font-weight: 500; color: var(--ink); border: 0; white-space: nowrap; }
.nav .brand:hover { color: var(--accent); }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; align-items: center; }
.nav a.navlink {
  position: relative; display: inline-flex; align-items: center;
  height: calc(var(--nav-h) - 1px);
  font-size: 14px; color: var(--muted); border: 0;
}
.nav a.navlink:hover, .nav a.navlink.active { color: var(--ink); }
.nav a.navlink.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; background: var(--accent);
}
.theme-btn {
  width: 34px; height: 34px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--muted);
  border: 1px solid var(--rule); border-radius: 999px;
  font-size: 14px; transition: .15s ease;
}
.theme-btn:hover { color: var(--accent); border-color: var(--accent); }
.nav-toggle { display: none; background: transparent; border: 0; color: var(--ink); cursor: pointer; font-size: 20px; padding: 4px 8px; }
@media (max-width: 760px) {
  .nav-toggle { display: inline-flex; }
  .nav ul {
    position: absolute; top: var(--nav-h); left: 0; right: 0;
    display: none; flex-direction: column; align-items: flex-start; gap: 10px;
    padding: 12px 28px 16px; background: var(--bg); border-bottom: 1px solid var(--rule);
  }
  .nav ul.open { display: flex; }
  .nav a.navlink { height: auto; padding: 4px 0; }
  .nav a.navlink.active::after { display: none; }
}

/* ---------- Hero ---------- */
.hero {
  display: grid; grid-template-columns: 210px 1fr; gap: 40px;
  align-items: start; padding: 40px 0 8px;
}
.portrait {
  width: 210px; height: 210px; overflow: hidden;
  border-radius: var(--radius); border: 1px solid var(--rule); background: var(--card);
}
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.portrait-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 68px; color: var(--ph-ink);
  background: var(--card);
}
.hero h1 { margin: 0 0 6px; font-size: clamp(30px, 3.4vw, 40px); letter-spacing: -0.015em; }
.hero .role { margin: 0 0 6px; color: var(--muted); font-size: 14.5px; }
.hero .role .dot { color: var(--subtle); margin: 0 8px; }
.hero .tagline { margin: 0 0 6px; color: var(--subtle); font-size: 14px; }
.hero .prose { max-width: var(--measure); }
.hero .bio { margin-top: 20px; }
.hero .bio p { font-size: 16px; }
.hero .bio p.aside { color: var(--muted); font-size: 15px; }
.motto {
  margin: 22px 0 0;
  padding-left: 16px;
  border-left: 2px solid var(--accent-weak);
  font-family: var(--font-serif); font-style: italic; font-size: 19px; line-height: 1.5;
  color: var(--ink);
}

.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; font: 400 12.5px/1.4 var(--font-sans);
  color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 999px;
  cursor: pointer; transition: .15s ease;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; gap: 20px; padding: 28px 0 4px; }
  .portrait { width: 150px; height: 150px; }
  .portrait-ph { font-size: 50px; }
  .motto { font-size: 17.5px; }
}

/* ---------- Research interests ---------- */
.interests { display: grid; grid-template-columns: 140px minmax(0, 1fr); row-gap: 14px; column-gap: 24px; align-items: baseline; }
.interests .group-name { font-size: 13px; color: var(--muted); }
.interests .tags { display: flex; flex-wrap: wrap; gap: 7px; }
.tag {
  font-size: 13px; line-height: 1.4; padding: 3px 11px;
  color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 999px;
}
.tag .q { color: var(--subtle); font-style: italic; }
@media (max-width: 560px) {
  .interests { grid-template-columns: 1fr; row-gap: 6px; }
  .interests .tags { margin-bottom: 10px; }
}

/* ---------- CV list ---------- */
.cv-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 22px; }
.cv-top { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; }
.cv-title { font-family: var(--font-serif); font-size: 17.5px; font-weight: 500; color: var(--ink); }
.cv-date { color: var(--subtle); font-size: 13px; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.cv-sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.cv-theme { color: var(--accent); font-size: 13.5px; margin: 6px 0 0; }
.cv-desc { color: var(--muted); font-size: 14px; margin: 7px 0 0; max-width: var(--measure); }
.cv-sub em, .cv-desc em { color: var(--subtle); }
.cv-item.featured { padding: 2px 0 2px 18px; border-left: 2px solid var(--accent); }
.cv-item.featured .cv-title { font-size: 19px; }
.cv-item.featured .cv-desc { color: var(--ink); font-size: 14.5px; }
.cv-list.compact { gap: 12px; }
.cv-list.compact .cv-title { font-size: 16px; }
.cv-list.compact .cv-sub { font-size: 13.5px; margin-top: 0; }
@media (max-width: 520px) { .cv-top { flex-direction: column; gap: 0; } }

/* ---------- News ---------- */
.news {
  list-style: none; padding: 0; margin: 0;
  display: grid; grid-template-columns: 110px minmax(0, 1fr);
  row-gap: 12px; column-gap: 24px;
}
.news li { display: contents; }
.news li[hidden] { display: none; }
.news .date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.news .body { font-size: 14.5px; }
.more-btn { margin-top: 18px; }
@media (max-width: 520px) {
  .news { grid-template-columns: 1fr; row-gap: 4px; }
  .news .date { padding-top: 10px; font-weight: 500; }
}

/* ---------- Research outputs & projects ---------- */
.pub-list { list-style: none; padding: 0; margin: 0; }
.pub { display: grid; grid-template-columns: 190px 1fr; gap: 28px; padding: 24px 0; border-top: 1px solid var(--rule); }
.pub:first-child { border-top: 0; padding-top: 4px; }
.thumb {
  aspect-ratio: 4 / 3; overflow: hidden;
  border-radius: var(--radius-sm); border: 1px solid var(--rule);
  background: #fff; display: flex; align-items: center; justify-content: center;
}
.thumb img { width: 100%; height: 100%; object-fit: contain; transition: transform .3s ease; }
.pub:hover .thumb img { transform: scale(1.035); }
.thumb.ph {
  background-color: var(--ph-bg);
  background-image: radial-gradient(color-mix(in srgb, var(--subtle) 38%, transparent) 1px, transparent 1.2px);
  background-size: 14px 14px;
}
.thumb.ph span {
  font-family: var(--font-serif); font-style: italic; font-size: 15px; text-align: center;
  color: var(--muted); background: var(--ph-bg); padding: 2px 12px; border-radius: 999px;
}
.pub .type { margin: 0 0 8px; }
.badge {
  display: inline-block; vertical-align: 1px;
  padding: 2px 10px; border-radius: 999px;
  font: 600 10.5px/1.5 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); background: var(--badge-bg); border: 1px solid var(--accent-weak);
}
.pub h3 { margin: 0 0 6px; font-size: 17.5px; }
.pub h3 a { color: var(--ink); border-bottom: 1px solid var(--rule); }
.pub h3 a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.pub .authors { margin: 0 0 4px; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.pub .venue { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.pub .summary { margin: 0 0 12px; font-size: 14px; color: var(--muted); max-width: var(--measure); }
.pub .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.pub .buttons .pill { font-size: 12px; padding: 3px 11px; }
.sub-label { margin-top: 36px; }
@media (max-width: 720px) {
  .pub { grid-template-columns: 1fr; gap: 14px; }
  .thumb { max-width: 300px; }
  .thumb.ph { display: none; }   /* placeholders add nothing on small screens */
}

/* ---------- Technical background (deliberately quiet) ---------- */
.skills { display: grid; grid-template-columns: 140px minmax(0, 1fr); row-gap: 8px; column-gap: 24px; font-size: 13.5px; }
.skills dt { color: var(--muted); }
.skills dd { margin: 0; color: var(--muted); }
@media (max-width: 560px) { .skills { grid-template-columns: 1fr; row-gap: 0; } .skills dd { margin-bottom: 8px; } }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--rule); margin-top: 40px; padding: 28px 0 40px; font-size: 12.5px; color: var(--muted); }
.site-footer .inner {
  max-width: 1040px; margin: 0 auto; padding: 0 28px;
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
}
.site-footer a { color: var(--muted); border-bottom: 1px solid transparent; }
.site-footer a:hover { color: var(--accent); border-bottom-color: var(--accent-weak); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  .nav, .site-footer, .pub .buttons, .more-btn { display: none !important; }
  .news li[hidden] { display: contents !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  a { color: #000; border: 0; }
  .pub, .hero, .cv-item { break-inside: avoid; }
}
</style>

    const img = (typeof MEDIA !== 'undefined' && /^media:/.test(p.image || '')) ? MEDIA[p.image.slice(6)] : p.image;
    const thumb = img
      ? `<div class="thumb"><img src="${img}" alt="${esc(p.imageAlt || p.title)}" loading="lazy" /></div>`
      : `<div class="thumb ph" aria-hidden="true"><span>${p.short || ''}</span></div>`;
    const title = p.url ? `<a href="${p.url}"${ext(p.url)}>${p.title}</a>` : p.title;
    const links = (p.links || []).map((l) => `<a class="pill" href="${l.url}"${ext(l.url)}>${l.label}</a>`).join('');
    return `
    <li class="pub">
      ${thumb}
      <div class="meta">
        ${p.type ? `<p class="type"><span class="badge">${p.type}</span></p>` : ''}
        <h3>${title}</h3>
        ${p.authors ? `<p class="authors">${markSelf(p.authors)}</p>` : ''}
        ${p.venue ? `<p class="venue">${p.venue}</p>` : ''}
        ${p.summary ? `<p class="summary">${p.summary}</p>` : ''}
        ${links ? `<div class="buttons">${links}</div>` : ''}
      </div>
    </li>`;
  }

  function researchSection() {
    if (!has(SITE.research) && !has(SITE.projects)) return '';
    return `
    <section id="research" class="section">
      ${has(SITE.research) ? `<h2 class="section-label">Research &amp; Presentations</h2>
      <ul class="pub-list">${SITE.research.map(outputItem).join('')}</ul>` : ''}
      ${has(SITE.projects) ? `<h2 class="section-label sub-label">Selected Projects</h2>
      <ul class="pub-list">${SITE.projects.map(outputItem).join('')}</ul>` : ''}
    </section>`;
  }

  function newsSection() {
    if (!has(SITE.news)) return '';
    const limit = SITE.newsVisible || SITE.news.length;
    const extra = SITE.news.length - limit;
    return `
    <section id="news" class="section">
      <h2 class="section-label">News</h2>
      <ul class="news" id="news-list">${SITE.news.map((n, i) =>
        `<li${i >= limit ? ' hidden' : ''}><span class="date">${n.date}</span><span class="body">${n.text}</span></li>`).join('')}</ul>
      ${extra > 0 ? `<button class="pill more-btn" type="button" aria-expanded="false" aria-controls="news-list" data-more="${extra}">Show earlier news</button>` : ''}
    </section>`;
  }

  const listSection = (id, label, items, cls) => has(items)
    ? `<section id="${id}" class="section"><h2 class="section-label">${label}</h2>${cvList(items, cls)}</section>` : '';

  function skillsSection() {
    if (!has(SITE.skills)) return '';
    return `
    <section id="skills" class="section">
      <h2 class="section-label">Technical background</h2>
      <dl class="skills">${SITE.skills.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    </section>`;
  }

  // ---------- Render ----------
  document.title = SITE.name;
  document.getElementById('main').innerHTML = [
    aboutSection(),
    researchSection(),
    listSection('experience', 'Research Experience', SITE.experience),
    newsSection(),
    listSection('awards', 'Scholarships &amp; Awards', SITE.awards, 'compact'),
    listSection('outreach', 'Outreach &amp; Community', SITE.outreach),
    skillsSection()
  ].join('');

  document.getElementById('brand').textContent = SITE.name;
  const navList = document.getElementById('nav-list');
  navList.innerHTML = (SITE.nav || [])
    .filter((id) => document.getElementById(id))
    .map((id) => `<li><a class="navlink" href="#${id}">${LABELS[id] || id}</a></li>`)
    .join('') + '<li><button class="theme-btn" type="button" data-theme-toggle aria-label="Toggle dark mode">☾</button></li>';

  document.getElementById('footer-left').innerHTML =
    `&copy; ${new Date().getFullYear()} ${SITE.name}${SITE.credit ? ` &middot; ${SITE.credit}` : ''}`;
  document.getElementById('footer-right').innerHTML =
    (SITE.links || []).map((l) => `<a href="${l.url}"${ext(l.url)}>${l.label}</a>`).join(' · ');

  // ---------- Theme (follows the system; the button overrides it for this visit) ----------
  const root = document.documentElement;
  const themeBtn = document.querySelector('[data-theme-toggle]');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)');
  let theme = null;
  function applyTheme() {
    if (theme) root.setAttribute('data-theme', theme); else root.removeAttribute('data-theme');
    const dark = theme === 'dark' || (!theme && sysDark.matches);
    themeBtn.textContent = dark ? '☀' : '☾';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  themeBtn.addEventListener('click', () => {
    const dark = theme === 'dark' || (!theme && sysDark.matches);
    theme = dark ? 'light' : 'dark';
    applyTheme();
  });
  sysDark.addEventListener('change', applyTheme);
  applyTheme();

  // ---------- News: show earlier items ----------
  const moreBtn = document.querySelector('.more-btn');
  if (moreBtn) {
    const hiddenItems = Array.from(document.querySelectorAll('#news-list li[hidden]'));
    moreBtn.addEventListener('click', () => {
      const open = moreBtn.getAttribute('aria-expanded') === 'true';
      hiddenItems.forEach((li) => { li.hidden = open; });
      moreBtn.setAttribute('aria-expanded', String(!open));
      moreBtn.textContent = open ? 'Show earlier news' : 'Show less';
    });
  }

  // ---------- Mobile nav ----------
  const navToggle = document.querySelector('.nav-toggle');
  navToggle.addEventListener('click', () => {
    const open = navList.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', String(open));
  });
  navList.addEventListener('click', (e) => {
    if (e.target.closest('a')) { navList.classList.remove('open'); navToggle.setAttribute('aria-expanded', 'false'); }
  });

  // ---------- Scroll spy ----------
  const navLinks = Array.from(document.querySelectorAll('.nav a.navlink'));
  const sections = navLinks.map((a) => document.getElementById(a.getAttribute('href').slice(1)));
  function setActive() {
    const y = window.scrollY + 90;
    let current = sections[0] && sections[0].id;
    sections.forEach((s) => { if (s.offsetTop <= y) current = s.id; });
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) current = sections[sections.length - 1].id;
    navLinks.forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
  }
  window.addEventListener('scroll', setActive, { passive: true });
  setActive();
})();
</script>
</body>
</html>
